<script>
// ==================== 配置 ====================
const SECRET_KEY = "WaterConservancy2026";
const TOTAL_CHUNKS = 20;        // 0-9 题库1，10-19 题库2
const CHUNK_URL_PREFIX = "chunk_";  // 文件名 chunk_0.json, chunk_1.json ...

// 全局数据
let fullBankData = { "1": { single: [], multiple: [], judgment: [] }, "2": { single: [], multiple: [], judgment: [] } };
let loadedChunks = new Array(TOTAL_CHUNKS).fill(false);
let currentBankId = 1;
let currentBank = null;
let bankCache = {};
let bankProgress = {};

// 业务变量（与原版相同）
let currentUser = null;
let isTrialMode = false;
let trialRemaining = 5;
let wrongCode = '';
let wrongItems = [];
let practiceMode = 'all';
let practiceType = 'single';
let practiceIndex = 0;
let practiceQuestions = [];
let selectedOptions = [];
let examData = { questions: [], userAnswers: {}, currentIndex: 0, filterType: 'all', answeredCount: 0, confirmed: {}, submitted: false, scores: { single:0, multiple:0, judgment:0 } };
let examWrongDetails = [];

const CLOUD = {
    REG_KEY: atob('WkNYWDIwMDIwMzA4'), USER_PREFIX: atob('U0xaQ0s='), ADMIN_EMAIL: atob('NjcwNjU2MjE2QHFxLmNvbQ=='),
    API_UPDATE: atob('aHR0cHM6Ly9hcGkudGV4dGRiLm9ubGluZS91cGRhdGUv'),
    API_READ: atob('aHR0cHM6Ly90ZXh0ZGIub25saW5lLw=='), TRIAL_LIMIT: 5
};

// IndexedDB 辅助（缓存已解密的题目分组）
const DB_NAME = 'QuestionBankDB';
const DB_VERSION = 3;
const STORE_NAME = 'chunks';

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
    });
}

async function saveDecryptedChunk(index, data) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(data, `chunk_${index}`);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve();
    });
}

async function loadDecryptedChunkFromDB(index) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(`chunk_${index}`);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
    });
}

// 解密函数（主线程备用，但我们将使用 Worker）
function base64ToUint8(base64) { const binary = atob(base64); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return bytes; }
function xorDecrypt(encryptedBytes, key) { const keyBytes = new TextEncoder().encode(key); const out = new Uint8Array(encryptedBytes.length); for (let i = 0; i < encryptedBytes.length; i++) out[i] = encryptedBytes[i] ^ keyBytes[i % keyBytes.length]; return new TextDecoder().decode(out); }

// 创建 Web Worker 用于解密
let decryptWorker = null;
function initWorker() {
    const workerCode = `
        self.onmessage = function(e) {
            const { base64Cipher, secretKey, chunkIndex } = e.data;
            try {
                function base64ToUint8(base64) {
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    return bytes;
                }
                function xorDecrypt(encryptedBytes, key) {
                    const keyBytes = new TextEncoder().encode(key);
                    const out = new Uint8Array(encryptedBytes.length);
                    for (let i = 0; i < encryptedBytes.length; i++) {
                        out[i] = encryptedBytes[i] ^ keyBytes[i % keyBytes.length];
                    }
                    return new TextDecoder().decode(out);
                }
                const encryptedBuf = base64ToUint8(base64Cipher);
                const decryptedJson = xorDecrypt(encryptedBuf, secretKey);
                const chunkData = JSON.parse(decryptedJson);
                self.postMessage({ success: true, chunkIndex, data: chunkData });
            } catch(err) {
                self.postMessage({ success: false, chunkIndex, error: err.message });
            }
        };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    URL.revokeObjectURL(url);
    return worker;
}

// 合并分组到 fullBankData
function mergeChunk(chunkData, chunkIndex) {
    const isBank1 = chunkIndex < 10;
    const bankId = isBank1 ? "1" : "2";
    const target = fullBankData[bankId];
    for (const type of ["single", "multiple", "judgment"]) {
        if (chunkData[type] && Array.isArray(chunkData[type])) {
            target[type].push(...chunkData[type]);
        }
    }
}

// 加载一个分组（优先从 IndexedDB 读取，否则 fetch + Worker 解密）
async function loadChunk(index, priority = false) {
    if (loadedChunks[index]) return true;
    // 1. 尝试从 IndexedDB 读取已解密的缓存
    const cached = await loadDecryptedChunkFromDB(index);
    if (cached) {
        mergeChunk(cached, index);
        loadedChunks[index] = true;
        return true;
    }
    // 2. 下载密文文件
    const url = `${CHUNK_URL_PREFIX}${index}.json`;
    let response;
    try {
        response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const base64Cipher = await response.text();
        // 3. 解密（使用 Worker）
        if (!decryptWorker) decryptWorker = initWorker();
        const result = await new Promise((resolve, reject) => {
            const handler = (e) => {
                if (e.data.chunkIndex === index) {
                    decryptWorker.removeEventListener('message', handler);
                    if (e.data.success) resolve(e.data.data);
                    else reject(new Error(e.data.error));
                }
            };
            decryptWorker.addEventListener('message', handler);
            decryptWorker.postMessage({ base64Cipher, secretKey: SECRET_KEY, chunkIndex: index });
        });
        // 4. 合并并缓存
        mergeChunk(result, index);
        await saveDecryptedChunk(index, result);
        loadedChunks[index] = true;
        return true;
    } catch (e) {
        console.error(`加载分组 ${index} 失败`, e);
        return false;
    }
}

// 后台静默加载所有未加载分组（非首屏）
async function loadRemainingChunks() {
    for (let i = 0; i < TOTAL_CHUNKS; i++) {
        if (!loadedChunks[i]) {
            await loadChunk(i);
            // 如果当前题库正在使用该分组对应的题库，刷新当前视图（可选）
            const affectedBankId = i < 10 ? 1 : 2;
            if (currentBankId === affectedBankId && currentBank === bankCache[currentBankId]) {
                // 重新从 fullBankData 构建 currentBank
                const newBank = { ...fullBankData[affectedBankId] };
                bankCache[currentBankId] = newBank;
                currentBank = newBank;
                // 刷新练习模式
                if (practiceMode !== 'wrong') {
                    loadPracticeQuestions();
                    renderPracticeQuestion();
                }
                // 考试模式不自动刷新，提示用户重新抽题
                if (document.querySelector('.mode-tab.active').dataset.mode === 'exam') {
                    // 可以显示一个非模态提示
                }
            }
            await new Promise(r => setTimeout(r, 100));
        }
    }
}

// 初始化系统：只加载第0组（题库1第1组）和第10组（题库2第1组）
async function initSystem() {
    const overlay = document.getElementById('initLoadingOverlay');
    const progressFill = document.getElementById('initProgressFill');
    const loadingText = document.getElementById('initLoadingText');
    
    loadingText.innerText = '检查本地缓存...';
    progressFill.style.width = '10%';
    
    // 尝试从 IndexedDB 恢复所有已缓存分组（快速恢复）
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const keys = await new Promise((resolve, reject) => {
        const req = store.getAllKeys();
        req.onerror = reject;
        req.onsuccess = () => resolve(req.result);
    });
    for (const key of keys) {
        const match = key.match(/chunk_(\d+)/);
        if (match) {
            const idx = parseInt(match[1]);
            const data = await loadDecryptedChunkFromDB(idx);
            if (data) {
                mergeChunk(data, idx);
                loadedChunks[idx] = true;
            }
        }
    }
    
    // 确保第0组和第10组已加载
    if (!loadedChunks[0]) {
        loadingText.innerText = '加载第1组题目...';
        progressFill.style.width = '30%';
        await loadChunk(0);
    }
    if (!loadedChunks[10]) {
        loadingText.innerText = '加载第2组题目...';
        progressFill.style.width = '50%';
        await loadChunk(10);
    }
    
    progressFill.style.width = '70%';
    loadingText.innerText = '准备界面...';
    
    // 构建当前题库
    bankCache[1] = { ...fullBankData["1"] };
    bankCache[2] = { ...fullBankData["2"] };
    currentBank = bankCache[currentBankId];
    bankProgress[currentBankId] = { totalBatches: 1, loadedBatches: 1 };
    
    progressFill.style.width = '90%';
    setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
        document.getElementById('disclaimerModal').style.display = 'flex';
    }, 500);
    
    // 后台加载剩余分组
    setTimeout(() => {
        loadRemainingChunks().catch(console.warn);
    }, 1500);
}
